[pytest]
# helpers.py lives at the repo root; this lets every test file "from helpers import approaches".
pythonpath = .
testpaths = .
python_files = test_*.py
# importlib mode: test files in different folders never clash, and folders need no __init__.py.
addopts = -ra --import-mode=importlib
norecursedirs = .git .github .venv venv __pycache__
